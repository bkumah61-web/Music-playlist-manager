<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array-Based Music Playlist Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .controls button {
            flex: 1;
            background: #334155;
            font-size: 0.85rem;
        }

        .controls button:hover {
            background: #475569;
        }

        .playlist-section h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .count-badge {
            background: #334155;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        ul.playlist {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        li.song-item {
            background: #0f172a;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            animation: fadeIn 0.3s ease;
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .index {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            font-style: italic;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            padding: 0.2rem 0.5rem;
            font-size: 0.85rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Array Playlist Manager</h1>
        <p class="subtitle">Demonstrating Data Structures (Arrays) in a Responsive Web App</p>

        <div class="input-group">
            <input type="text" id="songInput" placeholder="Enter song title & artist..." autocomplete="off">
            <button onclick="addSong()">Add Song</button>
        </div>

        <div class="controls">
            <button onclick="playNext()">▶ Play Next (Shift)</button>
            <button onclick="clearPlaylist()">Clear All</button>
        </div>

        <div class="playlist-section">
            <h3>
                Current Queue 
                <span class="count-badge" id="songCount">0 items</span>
            </h3>
            <ul id="playlistContainer" class="playlist">
                <div class="empty-state">Playlist array is currently empty.</div>
            </ul>
        </div>
    </div>

    <script>
        // Core data structure: JavaScript Array (equivalent to string playlist[] in C++)
        let playlist = [];
        const MAX_LIMIT = 10;

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            const countBadge = document.getElementById('songCount');
            
            countBadge.innerText = `${playlist.length} / ${MAX_LIMIT} items`;

            if (playlist.length === 0) {
                container.innerHTML = `<div class="empty-state">Playlist array is currently empty.</div>`;
                return;
            }

            container.innerHTML = '';
            for (let i = 0; i < playlist.length; i++) {
                container.innerHTML += `
                    <li class="song-item">
                        <div class="song-info">
                            <span class="index">[${i}]</span>
                            <span>${escapeHtml(playlist[i])}</span>
                        </div>
                        <button class="delete-btn" onclick="removeSong(${i})">Remove</button>
                    </li>
                `;
            }
        }

        function addSong() {
            const input = document.getElementById('songInput');
            const songName = input.value.trim();

            if (!songName) {
                alert("Please enter a valid song title.");
                return;
            }

            if (playlist.length >= MAX_LIMIT) {
                alert(`Playlist array limit reached (Max: ${MAX_LIMIT}).`);
                return;
            }

            // Equivalent to pushing element into C++ array
            playlist.push(songName);
            input.value = '';
            renderPlaylist();
        }

        function playNext() {
            if (playlist.length === 0) {
                alert("No songs left in the playlist array queue!");
                return;
            }
            
            const playing = playlist.shift(); // Removes the first element and shifts indices down (like our C++ shift loop)
            alert(`Now Playing: "${playing}"`);
            renderPlaylist();
        }

        function removeSong(index) {
            playlist.splice(index, 1); // Removes element at specific index
            renderPlaylist();
        }

        function clearPlaylist() {
            playlist = [];
            renderPlaylist();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Allow pressing Enter key to submit
        document.getElementById('songInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addSong();
            }
        });
    </script>
</body>
</html>
